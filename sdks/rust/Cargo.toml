[package]
name = "cognitum-one"
version = "0.2.1"
edition = "2021"
description = "Official Cognitum SDK for Rust"
license = "MIT"
readme = "README.md"
keywords = ["cognitum", "ai", "mcp", "sdk", "seed"]
categories = ["api-bindings", "web-programming::http-client"]
repository = "https://github.com/cognitum-one/sdks"
homepage = "https://cognitum.one"
documentation = "https://docs.rs/cognitum-one"
include = [
    "src/**/*",
    "benches/**/*",
    "tests/**/*",
    "docs/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
seed = ["dep:url"]
stream = ["seed", "dep:eventsource-stream"]
# Meta LLM serving client (ADR-0019 §D2, ADR-0024a). Gates the `meta_llm`
# module's code and its one new optional dependency (`uuid`, for
# ADR-0024a §D1 correlation IDs) — matches the ADR-0019 §D2 namespace map
# (`cognitum_one::meta_llm`, `meta-llm`).
meta-llm = ["dep:uuid"]
blocking = ["reqwest/blocking"]
live-seed-tests = ["seed"]
# Opt-in mDNS discovery (ADR-0016a §D6, Phase 3). One-shot `_cognitum._tcp.local`
# query; parses TXT records into `DiscoveredPeer`. Pulls in `mdns-sd` which
# uses `flume` + `socket2` but NO async runtime of its own, so it can run
# from a `tokio::task::spawn_blocking` context.
mdns = ["seed", "dep:mdns-sd"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Fixed-format sentinel matchers for the ADR-0028 §D13 redaction scan
# (`agentic::sentinel::SentinelSecretRedactor`) — bearer/JWT/PEM/cloud-key/
# pre-signed-URL patterns. Already pulled transitively via other deps; named
# directly here since `agentic::sentinel` depends on it explicitly.
regex = "1"
# `process` + `io-util` are required for the MCP stdio transport
# (OQ-4, src/mcp/stdio.rs): we spawn the MCP server as a tokio subprocess
# and frame JSON over its stdin/stdout with BufReader::read_line.
# `time` / `macros` predate the stdio work and are still used by the
# seed client's retry loop and the #[tokio::test] macro.
tokio = { version = "1", features = ["time", "macros", "process", "io-util"] }
url = { version = "2", optional = true }
eventsource-stream = { version = "0.2", optional = true }
# `async-trait` backs both the `Discovery` trait (§D6, seed feature) and the
# `Transport` trait that powers the MCP client surface (src/mcp/transport.rs).
# Pulled in unconditionally as of 2026-04-23 so the cloud-only default build
# can expose `mcp::Transport` without forcing callers to turn on `seed`.
async-trait = "0.1"
# Phase 3 mDNS discovery (ADR-0016a §D6). `default-features = false` drops
# the optional `async`/`log` integrations — we drive mdns-sd's sync receiver
# from `tokio::task::spawn_blocking` ourselves.
mdns-sd = { version = "0.19", optional = true, default-features = false }
# Per-peer `fp=` cert fingerprint pinning for the seed rustls handshake
# (ADR-0014c §"fp= cert pinning", ADR-0007 §TLS). `sha2` computes the
# SHA-256 digest of the presented end-entity cert; `rustls` and
# `webpki-roots` are already pulled transitively by reqwest's
# `rustls-tls` feature, we surface them here so our custom
# `ServerCertVerifier` sees the same rustls 0.23 types reqwest does.
sha2 = { version = "0.10", default-features = false }
# HMAC-SHA256 receipt/lineage signing (ADR-0028 §D7/§D9, issue #56). Symmetric
# HMAC is a deliberate scope limit vs. an asymmetric PKI — see
# `agentic::receipt_verification` module docs.
hmac = { version = "0.12", default-features = false }
rustls = { version = "0.23", default-features = false }
webpki-roots = "1.0"
# Request-ID correlation for the Meta LLM client (ADR-0024a §D1, `meta-llm`
# feature only). `v4` is the only generator strategy needed — random,
# non-sequential request IDs, matching the Node SDK's `crypto.randomUUID()`
# and Python's `uuid.uuid4()`.
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
rcgen = "0.13"
