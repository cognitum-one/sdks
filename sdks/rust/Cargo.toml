[package]
name = "cognitum-rs"
version = "0.1.0"
edition = "2021"
description = "Official Cognitum SDK for Rust"
license = "MIT"
keywords = ["cognitum", "ai", "mcp", "sdk", "seed"]
categories = ["api-bindings", "web-programming::http-client"]
repository = "https://github.com/ruvnet/cognitum"
homepage = "https://cognitum.one"
documentation = "https://api.cognitum.one/apiOpenSpec"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
seed = ["dep:url"]
stream = ["seed", "dep:eventsource-stream"]
blocking = ["reqwest/blocking"]
live-seed-tests = ["seed"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "macros"] }
url = { version = "2", optional = true }
eventsource-stream = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
