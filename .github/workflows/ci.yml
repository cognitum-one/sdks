name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # Pin the required GA security gate so its semantics cannot change
    # underneath a reviewed SDK commit.
    uses: cognitum-one/.github/.github/workflows/security-scan.yml@5eb92ac7c8a8b72814663ab58d9241dd8e0510ae

  node:
    name: node / ${{ matrix.os }} (build, test, typecheck, lint, audit)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          # The seed-integration suite only runs when it can reach a real
          # device over an SSH tunnel (see tests/seed/integration/live-seed.test.ts);
          # it self-skips without one. We still pin this explicitly so CI
          # never depends on whatever happens to be listening on the tunnel
          # port on the runner.
          SKIP_SEED_INTEGRATION: "1"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --audit-level=high

  python:
    name: python / ${{ matrix.os }} (pytest, ruff, mypy)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
        env:
          # Same rationale as the Node job: the live-seed test module
          # self-skips without a reachable tunnel, but we pin this so CI
          # never depends on runner-local port state.
          SKIP_SEED_INTEGRATION: "1"
      - run: ruff check .
      - run: mypy

  rust:
    name: rust / ${{ matrix.os }} (build, test, clippy)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      # `live-seed-tests` is intentionally excluded from `--all-features`
      # here: per its own doc comment (tests/seed_live.rs) it dials a real
      # seed over an SSH tunnel and self-skips without one, but CI
      # shouldn't depend on runner-local port state to get that skip
      # (same reasoning as the Node/Python SKIP_SEED_INTEGRATION env var).
      - name: build (all features except live-seed-tests)
        run: cargo build --features "native-tls,seed,stream,blocking,mdns,meta-llm,meta-proxy,metaharness,harnessaas"
      - name: test (all features except live-seed-tests)
        run: cargo test --features "native-tls,seed,stream,blocking,mdns,meta-llm,meta-proxy,metaharness,harnessaas"
      - name: clippy (all features except live-seed-tests)
        run: cargo clippy --all-targets --features "native-tls,seed,stream,blocking,mdns,meta-llm,meta-proxy,metaharness,harnessaas" -- -D warnings

  rust-feature-matrix:
    name: rust feature matrix / ${{ matrix.os }} (build, ${{ matrix.feature }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sdks/rust
    strategy:
      fail-fast: false
      matrix:
        # `cognitum-one` always needs a TLS backend from reqwest (rustls or
        # native-tls), so a literal `--no-default-features` build can't
        # compile — "default" here (`rustls`, via Cargo.toml's
        # `default = ["rustls"]`) is the closest meaningful baseline.
        # Each remaining feature is then built individually on top of it.
        # `live-seed-tests` is excluded — see the comment on the `rust` job.
        include:
          - { os: Linux, runner: ubuntu-latest, feature: default, args: "" }
          - { os: Linux, runner: ubuntu-latest, feature: native-tls, args: "--features native-tls" }
          - { os: Linux, runner: ubuntu-latest, feature: seed, args: "--features seed" }
          - { os: Linux, runner: ubuntu-latest, feature: stream, args: "--features stream" }
          - { os: Linux, runner: ubuntu-latest, feature: blocking, args: "--features blocking" }
          - { os: Linux, runner: ubuntu-latest, feature: mdns, args: "--features mdns" }
          - { os: Linux, runner: ubuntu-latest, feature: meta-llm, args: "--features meta-llm" }
          - { os: Linux, runner: ubuntu-latest, feature: meta-proxy, args: "--features meta-proxy" }
          - { os: Linux, runner: ubuntu-latest, feature: metaharness, args: "--features metaharness" }
          - { os: Linux, runner: ubuntu-latest, feature: harnessaas, args: "--features harnessaas" }
          - { os: macOS, runner: macos-latest, feature: native-tls, args: "--features native-tls" }
          - { os: macOS, runner: macos-latest, feature: mdns, args: "--features mdns" }
          - { os: Windows, runner: windows-latest, feature: native-tls, args: "--features native-tls" }
          - { os: Windows, runner: windows-latest, feature: mdns, args: "--features mdns" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      # Build-only (not `cargo test`): with `seed`/`default` alone (no
      # `native-tls`), reqwest's rustls-only backend defers PEM validation
      # instead of doing it eagerly, so
      # `client::tests::invalid_pem_is_surfaced_as_validation_error` and
      # `builder_trust_root_pem_round_trips` fail there — a pre-existing,
      # already-tracked gap (see docs/adr/0014c-rust-sdk-implementation-release.md
      # §"Do NOT touch src/client.rs or src/error.rs"), not something this
      # CI skeleton is trying to fix. The full test suite runs, green, in
      # the `rust` job above where `native-tls` is always enabled alongside
      # every other feature.
      - name: build (feature = ${{ matrix.feature }})
        run: cargo build ${{ matrix.args }}

  capability-manifest:
    name: capability manifest (schema + registry drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Validates capabilities/sdk-release.v1.json against
      # capabilities/sdk-release.schema.json, then independently re-checks
      # each language's claimed registryVersion against the live npm/PyPI/
      # crates.io APIs -- the exact class of drift (source committed,
      # registry never actually updated) that slipped through undetected in
      # the 2026-07-19 crates.io 0.3.0 publish gap. See issue #123 and
      # cognitum-one/website ADR-101 ("Drift prevention").
      - run: node scripts/verify-release-manifest.mjs

  ga-gate:
    name: GA gate (maturity + evidence)
    runs-on: ubuntu-latest
    # This job's check-run name is the ONLY required status check on `main`
    # and the only CI result `release.yml` consults before publishing, so its
    # `needs` list is the de facto definition of "CI is green". Every job in
    # this workflow must therefore be listed here: omitting one silently
    # demotes it to advisory. `rust-feature-matrix` and `capability-manifest`
    # were previously missing, which meant a red per-feature build or a red
    # registry-drift check blocked neither a merge nor a release.
    needs: [security, node, python, rust, rust-feature-matrix, capability-manifest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/tests/*.test.mjs
      - run: node scripts/verify-ga-gate.mjs
