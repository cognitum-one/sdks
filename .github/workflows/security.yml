name: security

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  supply-chain-pins:
    name: supply-chain pins and lockfile integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node scripts/verify-supply-chain.mjs

  scan:
    uses: cognitum-one/.github/.github/workflows/security-scan.yml@0f90efc5230237b406aee2d2f823219a57be4fce # cognitum-one/.github main 2026-09-10 (#101)
